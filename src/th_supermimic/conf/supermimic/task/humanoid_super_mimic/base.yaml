# @package _global_
env:
  seed: null
  scene:
    model_file: ${oc.env:TH_SUPERMIMIC_ASSETS}/scene.xml
    default_keyframe_name: stand
    entities:
      robot:
        root_body_name: pelvis
        joint_names: []
        actuator_names: []
        body_names: []
      ground:
        geom_names:
        - floor
  sim_dt: 0.005
  ctrl_dt: 0.02
  max_episode_seconds: 10.0
  auto_reset: true
  scale_rewards_by_dt: false
  observations:
    policy:
      enable_corruption: false
      terms:
        obs:
          func: th_supermimic.tasks.motion_tracking.humanoid.supermimic.manager_terms.supermimic_obs
          params:
            command_name: motion
    future:
      enable_corruption: false
      terms:
        goal:
          func: th_supermimic.tasks.motion_tracking.humanoid.supermimic.manager_terms.supermimic_goal
          params:
            command_name: motion
            num_frames: 10
  actions:
    joint_pos:
      _target_: th_supermimic.tasks.motion_tracking.humanoid.supermimic.manager_terms.SuperMimicActionCfg
      entity_name: robot
      command_name: motion
  commands:
    motion:
      _target_: th_supermimic.tasks.motion_tracking.humanoid.supermimic.manager_terms.SuperMimicCommandCfg
      entity_name: robot
      mjcf_path: ${oc.env:TH_SUPERMIMIC_ASSETS}/robot.xml
      eval_mode: false
      gamma: 0.99
      src_fps: 50.0
      reset_noise: true
      max_episode_steps: 500
      goal_frames: 10
      context_dim: 33
      resampling_time_range:
      - 1.0e9
      - 1.0e9
      motion_files: []
  events:
    startup_context:
      _target_: unilab.managers.EventTermCfg
      func: th_supermimic.tasks.motion_tracking.humanoid.supermimic.manager_terms.SuperMimicContextEvent
      mode: startup
      params:
        command_name: motion
        asset_cfg: &id001
          _target_: unilab.managers.SceneEntityCfg
          name: robot
        ground_asset_cfg: &id002
          _target_: unilab.managers.SceneEntityCfg
          name: ground
          geom_names:
          - floor
    reset_context:
      _target_: unilab.managers.EventTermCfg
      func: th_supermimic.tasks.motion_tracking.humanoid.supermimic.manager_terms.SuperMimicContextEvent
      mode: reset
      params:
        command_name: motion
        asset_cfg: *id001
        ground_asset_cfg: *id002
    joint_offsets:
      _target_: unilab.managers.EventTermCfg
      func: th_supermimic.tasks.motion_tracking.humanoid.supermimic.manager_terms.SuperMimicJointOffsetEvent
      mode: reset
      params:
        command_name: motion
  terminations:
    hard:
      _target_: unilab.managers.TerminationTermCfg
      func: th_supermimic.tasks.motion_tracking.humanoid.supermimic.manager_terms.supermimic_termination
      params:
        command_name: motion
    timeout:
      _target_: unilab.managers.TerminationTermCfg
      func: th_supermimic.tasks.motion_tracking.humanoid.supermimic.manager_terms.supermimic_timeout
      time_out: true
      params:
        command_name: motion
    clip_end:
      _target_: unilab.managers.TerminationTermCfg
      func: th_supermimic.tasks.motion_tracking.humanoid.supermimic.manager_terms.supermimic_clip_end
      time_out: true
      params:
        command_name: motion
  policy_observation_group: policy
  critic_observation_group: future
reward:
  tracking:
    _target_: unilab.managers.RewardTermCfg
    func: th_supermimic.tasks.motion_tracking.humanoid.supermimic.manager_terms.supermimic_reward
    weight: 1.0
    params:
      command_name: motion
