[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "th-supermimic"
version = "0.1.0"
description = "K1 and G1 SuperMimic training on RMAI primitive transition corpora"
requires-python = ">=3.10,<3.14"
dependencies = ["torch>=2.5", "mujoco==3.8.1", "numpy>=1.24", "rich>=13"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
warp = ["mujoco-warp==3.8.1", "warp-lang==1.13.0"]
logging = ["tensorboard>=2.14"]
video = ["imageio[ffmpeg]>=2.37", "pillow>=10"]

[project.scripts]
th-supermimic-train = "th_supermimic.scripts.launch:main"
th-supermimic-eval = "th_supermimic.scripts.launch:evaluate_main"
th-supermimic-video = "th_supermimic.scripts.launch:video_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
th_supermimic = ["robots/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
