[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "th-supermimic"
version = "0.1.0"
description = "K1 and G1 SuperMimic training on RMAI primitive transition corpora"
requires-python = ">=3.10,<3.14"
dependencies = ["unilab[mjwarp,mujoco]==1.5.1", "mujoco~=3.11.0", "numpy>=1.24", "hydra-core>=1.3", "imageio[ffmpeg]>=2.37", "pillow>=10"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
th-supermimic-train = "th_supermimic.scripts.launch:main"
th-supermimic-eval = "th_supermimic.tasks.motion_tracking.humanoid.supermimic.evaluate:main"
th-supermimic-video = "th_supermimic.tasks.motion_tracking.humanoid.supermimic.render:main"

[project.entry-points."unilab.tasks"]
th_supermimic = "th_supermimic.tasks"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
th_supermimic = ["robots/*.json", "conf/**/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
